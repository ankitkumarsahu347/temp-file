<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>My To-Do List</h1>
  <p class="subtitle">Stay organized and get things done.</p>

  <form id="todoForm" class="todo-form">
    <input id="todoInput" type="text" placeholder="Enter a task..." autocomplete="off" required maxlength="255">
    <button type="submit">Add Task</button>
  </form>

  <div class="toolbar">
    <span id="taskCount">0 tasks remaining</span>
    <button id="clearCompleted" type="button">Clear completed</button>
  </div>

  <ul id="todoList" class="todo-list"></ul>
  <p id="emptyState" class="empty">No tasks yet. Add your first task!</p>
</main>
<script src="script.js"></script>
</body>
</html>
